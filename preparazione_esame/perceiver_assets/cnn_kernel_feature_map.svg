<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Kernel to feature map</title>
  <desc id="desc">A local kernel slides over an image patch, multiplies values and writes the result into a feature map.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1a237e"/>
    </marker>
    <style>
      .title{font:800 28px system-ui,Segoe UI,sans-serif;fill:#1a237e}
      .label{font:800 16px system-ui,Segoe UI,sans-serif;fill:#1a237e}
      .small{font:600 12px system-ui,Segoe UI,sans-serif;fill:#4f566b}
      .num{font:800 15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#1b1f2f;text-anchor:middle;dominant-baseline:middle}
      .cell{fill:#fff;stroke:#dfe4f2;stroke-width:2}
      .hot{fill:#fff4e8;stroke:#ff6d00;stroke-width:3}
      .map{fill:#eef3ff;stroke:#9eabde;stroke-width:2}
      .arrow{stroke:#1a237e;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="980" height="430" fill="#f7f8ff"/>
  <text class="title" x="34" y="48">Dal kernel alla feature map</text>
  <text class="small" x="35" y="74">Un filtro e' un detector locale: guarda una finestra, fa prodotto elemento per elemento, somma e scrive una risposta.</text>

  <g transform="translate(55 118)">
    <text class="label" x="0" y="-18">Input image patch</text>
    <g>
      <rect class="cell" x="0" y="0" width="42" height="42"/><rect class="cell" x="42" y="0" width="42" height="42"/><rect class="cell" x="84" y="0" width="42" height="42"/><rect class="cell" x="126" y="0" width="42" height="42"/><rect class="cell" x="168" y="0" width="42" height="42"/>
      <rect class="cell" x="0" y="42" width="42" height="42"/><rect class="hot" x="42" y="42" width="42" height="42"/><rect class="hot" x="84" y="42" width="42" height="42"/><rect class="hot" x="126" y="42" width="42" height="42"/><rect class="cell" x="168" y="42" width="42" height="42"/>
      <rect class="cell" x="0" y="84" width="42" height="42"/><rect class="hot" x="42" y="84" width="42" height="42"/><rect class="hot" x="84" y="84" width="42" height="42"/><rect class="hot" x="126" y="84" width="42" height="42"/><rect class="cell" x="168" y="84" width="42" height="42"/>
      <rect class="cell" x="0" y="126" width="42" height="42"/><rect class="hot" x="42" y="126" width="42" height="42"/><rect class="hot" x="84" y="126" width="42" height="42"/><rect class="hot" x="126" y="126" width="42" height="42"/><rect class="cell" x="168" y="126" width="42" height="42"/>
      <rect class="cell" x="0" y="168" width="42" height="42"/><rect class="cell" x="42" y="168" width="42" height="42"/><rect class="cell" x="84" y="168" width="42" height="42"/><rect class="cell" x="126" y="168" width="42" height="42"/><rect class="cell" x="168" y="168" width="42" height="42"/>
      <text class="num" x="63" y="63">10</text><text class="num" x="105" y="63">10</text><text class="num" x="147" y="63">0</text>
      <text class="num" x="63" y="105">10</text><text class="num" x="105" y="105">10</text><text class="num" x="147" y="105">0</text>
      <text class="num" x="63" y="147">10</text><text class="num" x="105" y="147">10</text><text class="num" x="147" y="147">0</text>
    </g>
  </g>

  <path class="arrow" d="M300 220 H365"/>
  <g transform="translate(390 137)">
    <text class="label" x="0" y="-20">Kernel 3x3</text>
    <rect class="hot" x="0" y="0" width="54" height="54"/><rect class="hot" x="54" y="0" width="54" height="54"/><rect class="hot" x="108" y="0" width="54" height="54"/>
    <rect class="hot" x="0" y="54" width="54" height="54"/><rect class="hot" x="54" y="54" width="54" height="54"/><rect class="hot" x="108" y="54" width="54" height="54"/>
    <rect class="hot" x="0" y="108" width="54" height="54"/><rect class="hot" x="54" y="108" width="54" height="54"/><rect class="hot" x="108" y="108" width="54" height="54"/>
    <text class="num" x="27" y="27">1</text><text class="num" x="81" y="27">0</text><text class="num" x="135" y="27">-1</text>
    <text class="num" x="27" y="81">1</text><text class="num" x="81" y="81">0</text><text class="num" x="135" y="81">-1</text>
    <text class="num" x="27" y="135">1</text><text class="num" x="81" y="135">0</text><text class="num" x="135" y="135">-1</text>
  </g>

  <path class="arrow" d="M585 220 H650"/>
  <g transform="translate(675 118)">
    <text class="label" x="0" y="-18">Feature map</text>
    <rect class="map" x="0" y="0" width="58" height="58"/><rect class="map" x="58" y="0" width="58" height="58"/><rect class="map" x="116" y="0" width="58" height="58"/>
    <rect class="map" x="0" y="58" width="58" height="58"/><rect class="hot" x="58" y="58" width="58" height="58"/><rect class="map" x="116" y="58" width="58" height="58"/>
    <rect class="map" x="0" y="116" width="58" height="58"/><rect class="map" x="58" y="116" width="58" height="58"/><rect class="map" x="116" y="116" width="58" height="58"/>
    <text class="num" x="87" y="87">30</text>
    <text class="small" x="0" y="205">Valore alto = pattern trovato qui</text>
  </g>

  <g transform="translate(55 355)">
    <rect x="0" y="0" width="870" height="44" rx="10" fill="#fff" stroke="#dfe4f2"/>
    <text class="small" x="20" y="27">La feature map e' una mappa di risposta: ogni cella misura quanto quel filtro ha riconosciuto il suo pattern.</text>
  </g>
</svg>
