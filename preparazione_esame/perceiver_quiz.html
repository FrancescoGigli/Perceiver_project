<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perceiver — Quiz interattivo</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --primary: #1a237e;
    --primary-soft: #eef0f8;
    --primary-softer: #f5f6fb;
    --accent: #e65100;
    --success: #2e7d32;
    --warning: #f9a825;
    --error: #c62828;
    --text: #1c1c1c;
    --muted: #6e6e76;
    --border: #e6e6ec;
    --shadow: 0 1px 2px rgba(20,20,40,.04), 0 8px 24px rgba(26,35,126,.06);
    --shadow-hover: 0 2px 6px rgba(20,20,40,.06), 0 12px 36px rgba(26,35,126,.10);
    --radius: 14px;
    --t: 180ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.55;
    min-height: 100vh; display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 760px; width: 100%; margin: 0 auto; padding: 28px 18px 80px; }
  header { margin-bottom: 22px; }
  h1 {
    font-size: 22px; font-weight: 650; color: var(--primary);
    letter-spacing: -0.015em; margin-bottom: 4px;
  }
  .subtitle { font-size: 13px; color: var(--muted); }

  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    margin-bottom: 18px;
  }
  .stat {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px;
  }
  .stat strong { display: block; font-size: 18px; font-weight: 650; color: var(--primary); }
  .stat span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }

  .modes { display: flex; gap: 8px; margin-bottom: 14px; }
  .mode {
    flex: 1; padding: 9px 10px; text-align: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; font-size: 13px; color: var(--muted);
    transition: all var(--t);
    user-select: none;
  }
  .mode:hover { color: var(--primary); border-color: var(--primary); }
  .mode.active {
    background: var(--primary); color: white; border-color: var(--primary);
    font-weight: 500;
  }

  .filters {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--border);
    font-size: 12px; cursor: pointer; color: var(--muted);
    transition: all var(--t); user-select: none;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); }
  .chip.active {
    background: var(--primary); color: white; border-color: var(--primary);
    font-weight: 500;
  }
  .chip-count {
    background: rgba(0,0,0,0.08); border-radius: 999px;
    padding: 1px 6px; font-size: 10px; font-weight: 600;
  }
  .chip.active .chip-count { background: rgba(255,255,255,0.22); }

  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 30px 28px;
    min-height: 320px;
    display: flex; flex-direction: column;
    transition: box-shadow var(--t);
  }
  .card:hover { box-shadow: var(--shadow-hover); }
  .card-header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 14px; margin-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .card-category {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--primary); font-weight: 700;
  }
  .card-progress { font-size: 12px; color: var(--muted); }

  .question {
    font-size: 18px; line-height: 1.45; font-weight: 500;
    margin-bottom: 22px;
  }
  .answer {
    font-size: 15px; line-height: 1.6;
    background: var(--primary-softer);
    border-left: 3px solid var(--primary);
    border-radius: 0 8px 8px 0;
    padding: 14px 16px;
    margin-bottom: 22px;
    animation: fadeIn 220ms ease-out;
  }
  .answer code {
    background: white; border: 1px solid var(--border);
    padding: 1px 5px; border-radius: 4px;
    font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 12.5px; color: var(--primary);
  }
  .answer strong { color: var(--primary); font-weight: 650; }
  .answer em { font-style: italic; color: #424242; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .hidden { display: none; }

  .btn-primary {
    align-self: center;
    background: var(--primary); color: white; border: none;
    padding: 12px 28px; border-radius: 8px;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: all var(--t);
  }
  .btn-primary:hover { background: #252e94; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26,35,126,.18); }
  .btn-primary:active { transform: translateY(0); }

  .grading {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    margin-top: auto;
  }
  .btn-grade {
    padding: 14px 10px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 500;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: all var(--t);
  }
  .btn-grade kbd {
    font-size: 10px; opacity: 0.65; font-weight: 500;
    font-family: "SFMono-Regular", Menlo, monospace;
    background: rgba(0,0,0,0.08); padding: 1px 5px; border-radius: 3px;
  }
  .btn-grade-bad { background: #fdecea; color: var(--error); }
  .btn-grade-bad:hover { background: #fbd5d2; transform: translateY(-1px); }
  .btn-grade-mid { background: #fff5d6; color: #c77600; }
  .btn-grade-mid:hover { background: #ffeab0; transform: translateY(-1px); }
  .btn-grade-good { background: #e3f2e6; color: var(--success); }
  .btn-grade-good:hover { background: #cae8d0; transform: translateY(-1px); }

  .empty {
    text-align: center; padding: 50px 20px; color: var(--muted);
    flex: 1; display: flex; flex-direction: column; justify-content: center;
  }
  .empty h2 { color: var(--primary); margin-bottom: 8px; font-size: 22px; font-weight: 650; }
  .empty p { margin-bottom: 18px; }

  .footer {
    text-align: center; margin-top: 30px; font-size: 12px; color: var(--muted);
    line-height: 1.7;
  }
  .footer kbd {
    background: var(--card); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 3px;
    font-family: "SFMono-Regular", Menlo, monospace; font-size: 11px;
    color: var(--text);
  }
  .footer .link {
    background: none; border: none; color: var(--muted); cursor: pointer;
    text-decoration: underline; font-size: 12px; padding: 0;
  }
  .footer .link:hover { color: var(--error); }
  .footer .sep { margin: 0 8px; color: #ccc; }

  @media (max-width: 600px) {
    .container { padding: 18px 12px 60px; }
    h1 { font-size: 19px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .card { padding: 24px 20px; min-height: 280px; }
    .question { font-size: 16px; }
    .grading { grid-template-columns: 1fr; }
    .modes { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Perceiver — Quiz</h1>
    <div class="subtitle">Ripasso interattivo per l'esame di Deep Learning</div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="modes">
    <div class="mode active" data-mode="srs">📚 Ripasso (spaced repetition)</div>
    <div class="mode" data-mode="all">🎲 Tutte le card (random)</div>
  </div>

  <div class="filters" id="filters"></div>

  <div class="card" id="card"></div>

  <div class="footer">
    <kbd>spazio</kbd> mostra risposta · <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> valuta · Salvataggio automatico nel browser
    <br>
    <button class="link" id="reset">Resetta progresso</button>
    <span class="sep">·</span>
    Basato su <code>perceiver_teoria_v2.pdf</code> e <code>appunti_ml_definitivo.pdf</code>
  </div>
</div>

<script>
"use strict";

// ============================================================
//   CATEGORIE
// ============================================================
const CATEGORIES = {
  "problema":     "Il problema",
  "idea":         "Idea centrale",
  "architettura": "Architettura",
  "fourier":      "Fourier features",
  "cross-att":    "Cross-Attention",
  "latent-tr":    "Latent Transformer",
  "ws":           "Weight sharing",
  "output":       "Output / Classificatore",
  "training":     "Training",
  "risultati":    "Risultati",
  "ablation":     "Ablation",
  "mattoni":      "Mattoni (LN/GELU/Res/Softmax)",
  "numeri":       "Numeri chiave",
  "backward":     "Backward pass"
};

// ============================================================
//   CARD (estratte dalle dispense)
// ============================================================
const CARDS = [
  // --- PROBLEMA ---
  { id: 1, cat: "problema",
    q: "Qual è il problema principale che il Perceiver risolve?",
    a: "La complessità <code>O(M²)</code> della self-attention del Transformer, impraticabile su input grandi. Es: ImageNet 224×224 = <strong>50.176 pixel</strong> → matrice di attenzione da ~2.5 miliardi di entry." },
  { id: 2, cat: "problema",
    q: "Confronto rapido: CNN vs Transformer — pregi e difetti.",
    a: "<strong>CNN</strong>: scalabili <code>O(MKL)</code> ma <em>specializzate per ogni dominio</em>. <strong>Transformer</strong>: generali ma <em>quadratici</em> <code>O(M²)</code>. Il Perceiver unisce i due lati buoni: generalità + scalabilità." },
  { id: 3, cat: "problema",
    q: "Quale riduzione di complessità ottiene il Perceiver?",
    a: "<code>O(M²) → O(MN) + O(N²)</code>. Con N=512 e M=50.176 ⇒ ~<strong>100× di riduzione</strong>. Poiché N è <em>fisso</em>, il costo cresce solo linearmente in M." },

  // --- IDEA CENTRALE ---
  { id: 10, cat: "idea",
    q: "Da dove vengono Q, K, V nella self-attention vs cross-attention?",
    a: "<strong>Self</strong>: Q, K, V tutti dallo stesso input X → matrice <code>M×M</code>. <strong>Cross</strong>: Q dai <em>latenti</em>, K e V dall'<em>input</em> → matrice <code>N×M</code> rettangolare." },
  { id: 11, cat: "idea",
    q: "Cos'è il \"latent array\" nel Perceiver?",
    a: "Una matrice <code>L ∈ ℝ^(N×D)</code> di <strong>parametri appresi</strong>. NON deriva dall'input. Sono \"unità di memoria\" — una base compatta che il modello usa per riassumere qualsiasi input." },
  { id: 12, cat: "idea",
    q: "Intuizione di Q, K, V in una riga ciascuno.",
    a: "<strong>Q</strong> = una <em>domanda</em> (\"cosa cerco?\"). <strong>K</strong> = un'<em>etichetta</em> (\"io rappresento questo\"). <strong>V</strong> = il <em>contenuto</em> informativo. L'attention confronta domande con etichette e restituisce media pesata dei contenuti." },
  { id: 13, cat: "idea",
    q: "Perché l'asimmetria N ≪ M rompe la quadraticità?",
    a: "Q ha poche righe (N latenti), K/V ne hanno tante (M input). Il prodotto QKᵀ è <code>N×M</code> rettangolare invece di <code>M×M</code> quadrato ⇒ costo <code>O(MN)</code>." },
  { id: 14, cat: "idea",
    q: "Come sono inizializzati i latenti?",
    a: "Come <em>learned position encodings</em> (paper App. C): <code>L_ij ~ 𝒩(0, 0.02²)</code> troncata a [-2, 2]. Valori minuscoli per stabilità (no saturazione softmax) e neutralità." },

  // --- ARCHITETTURA ---
  { id: 20, cat: "architettura",
    q: "Quali sono i 3 stadi del Perceiver?",
    a: "<strong>(1)</strong> Encoder cross-attention (comprime input → latenti). <strong>(2)</strong> Latent transformer (raffina con self-attention profonda). <strong>(3)</strong> Pooling + classificatore (produce i logit)." },
  { id: 21, cat: "architettura",
    q: "Quali due proprietà definiscono il Perceiver?",
    a: "<strong>(1)</strong> Stesso modello per modalità diverse <em>senza modifiche</em>. <strong>(2)</strong> Profondità della rete <em>disaccoppiata</em> dalla lunghezza dell'input." },
  { id: 22, cat: "architettura",
    q: "Cosa permette di ripetere il blocco T volte senza problemi di compatibilità?",
    a: "L'<strong>invarianza dimensionale</strong>: cross-attention e latent transformer preservano entrambi la forma <code>N×D</code>. È sempre la stessa matrice, solo aggiornata." },
  { id: 23, cat: "architettura",
    q: "Single-head o multi-head: cross-attention vs latent transformer?",
    a: "<strong>Cross-attention</strong> (encoder): <em>single-head</em> nel paper. <strong>Latent transformer</strong>: <em>multi-head</em>, H=8 teste da d_head=128." },

  // --- FOURIER ---
  { id: 30, cat: "fourier",
    q: "Perché servono le Fourier features?",
    a: "L'attention è <strong>cieca alla posizione</strong>. Un pixel [R,G,B] dice solo il colore, non DOVE è. Servono per iniettare la posizione esplicitamente nell'input." },
  { id: 31, cat: "fourier",
    q: "Formula del positional encoding di Fourier (1 asse).",
    a: "<code>PE(x_d) = [sin(f₁πx_d), cos(f₁πx_d), …, sin(f_Kπx_d), cos(f_Kπx_d), x_d]</code><br>→ 2K valori sinusoidali + 1 coordinata grezza." },
  { id: 32, cat: "fourier",
    q: "Frequenze: linearly spaced o esponenziali come NeRF? Perché?",
    a: "<strong>Linearly spaced</strong> tra 1 e μ/2 (Nyquist). NeRF usa <code>f_k = 2^k</code> ma con K=64 ⇒ <code>2⁶⁴ ≈ 10¹⁹</code>: numeri ingestibili. Il paper riporta instabilità di training già oltre k≈15 con NeRF (App. D)." },
  { id: 33, cat: "fourier",
    q: "Perché si concatena anche la coordinata grezza x_d?",
    a: "Le sinusoidi sono <strong>periodiche</strong> (ambigue: frequenze alte mappano posizioni diverse nello stesso valore). La coordinata grezza dà l'<em>identità posizionale</em> esatta, senza ambiguità." },
  { id: 34, cat: "fourier",
    q: "Si concatena o si somma al colore? Perché?",
    a: "Si <strong>concatena</strong>. Preserva colore e posizione separati. La somma li mescolerebbe in modo ambiguo. (I Transformer per NLP invece sommano il PE.)" },
  { id: 35, cat: "fourier",
    q: "Calcolo di C_tot = 261 per ImageNet.",
    a: "Per asse: <code>2K+1 = 129</code> (128 sinusoidi + 1 coord. grezza). Con d=2 assi: <code>2×129 = 258</code> Fourier. Sommati ai 3 RGB: <code>3 + 258 = 261</code>." },

  // --- CROSS-ATTENTION ---
  { id: 40, cat: "cross-att",
    q: "Cosa fa la LayerNorm pre-attention?",
    a: "Normalizza <em>ogni riga</em> (latente o pixel) a media 0 e varianza 1, poi applica γ, β appresi. <strong>Pre-norm</strong>: LN <em>prima</em> del blocco, il residuo resta un percorso \"pulito\" per il gradiente." },
  { id: 41, cat: "cross-att",
    q: "Quanto vale d_QKV per ImageNet e perché?",
    a: "<code>d_QKV = min(D, C_tot) = min(1024, 261) = <strong>261</strong></code>. L'input ha già solo 261 canali: proiettare K/V in dimensione maggiore non aggiungerebbe informazione, sarebbe spreco di parametri." },
  { id: 42, cat: "cross-att",
    q: "Forme di Q, K, V dopo le proiezioni (ImageNet).",
    a: "<code>Q = L̃·W_Q ∈ ℝ^(512×261)</code> (dai latenti).<br><code>K = X̃·W_K ∈ ℝ^(50.176×261)</code>, <code>V = X̃·W_V ∈ ℝ^(50.176×261)</code> (dall'input)." },
  { id: 43, cat: "cross-att",
    q: "Forma della matrice di attenzione A nella cross-attention.",
    a: "<code>A ∈ ℝ^(N×M) = ℝ^(512×50.176)</code> — <strong>rettangolare</strong>, non quadrata. Da qui il costo <code>O(MN)</code> invece di <code>O(M²)</code>." },
  { id: 44, cat: "cross-att",
    q: "Perché si fa lo scaling per √d_QKV nella softmax?",
    a: "Senza scaling, gli score avrebbero deviazione standard ≈ √d_QKV ≈ 16 ⇒ la softmax <em>satura</em> (tutta la massa su un solo pixel) e i gradienti si annullano." },
  { id: 45, cat: "cross-att",
    q: "Le proiezioni Q/K/V hanno bias?",
    a: "<strong>NO</strong>. Paper App. C: \"linear layers\" senza bias. Il bias compare solo in W_o, MLP e classificatore finale." },
  { id: 46, cat: "cross-att",
    q: "Hidden dim della MLP nel blocco cross-attention?",
    a: "<strong>4D = 4×1024 = 4096</strong>. Pattern standard GPT-2 (espansione a 4×, GELU, compressione)." },
  { id: 47, cat: "cross-att",
    q: "Output del blocco cross-attention + MLP: che forma ha?",
    a: "<code>L̂ ∈ ℝ^(512×1024)</code>, <strong>stessa forma di L</strong>. Il blocco non cambia la dimensione, solo il contenuto. È questa invarianza che permette di ripetere il blocco T volte." },

  // --- LATENT TRANSFORMER ---
  { id: 50, cat: "latent-tr",
    q: "Quante teste e quale d_head nel latent transformer?",
    a: "<strong>H = 8 teste</strong>, <code>d_head = D/H = 1024/8 = 128</code>." },
  { id: 51, cat: "latent-tr",
    q: "Forma della matrice di attenzione del latent transformer.",
    a: "<code>A ∈ ℝ^(N×N) = ℝ^(512×512)</code> — quadrata ma <strong>piccola</strong>. Costo <code>O(N²)</code> trascurabile grazie al bottleneck." },
  { id: 52, cat: "latent-tr",
    q: "Quale architettura adotta il latent transformer?",
    a: "<strong>GPT-2</strong> (Radford et al. 2019): LN → MHSA → residual → LN → MLP (GELU, hidden 4D) → residual. <em>Non causale</em> — nessuna maschera." },
  { id: 53, cat: "latent-tr",
    q: "Perché la profondità del modello \"vive\" qui?",
    a: "La matrice di attenzione è <code>N×N</code>: impilare molti layer costa <strong>O(N²), non O(M²)</strong>. La profondità della rete è <em>disaccoppiata</em> dalla dimensione dell'input." },

  // --- WEIGHT SHARING ---
  { id: 60, cat: "ws",
    q: "Quante volte si ripete il blocco cross-att + latent transf?",
    a: "<strong>T = 8</strong> volte." },
  { id: 61, cat: "ws",
    q: "Quale eccezione c'è nel weight sharing?",
    a: "Il <strong>primo blocco</strong> ha pesi propri (CA₁, LT₁ unici). Solo CA₂…CA_T e LT₂…LT_T condividono i pesi tra loro." },
  { id: 62, cat: "ws",
    q: "Perché il primo blocco è escluso dallo sharing?",
    a: "Alla prima iterazione i latenti sono \"neutri\" (init 𝒩(0, 0.02²)); dalla seconda in poi sono già \"popolati\" di informazione. Due regimi così diversi non possono condividere pesi senza causare <strong>instabilità di training</strong>." },
  { id: 63, cat: "ws",
    q: "A cosa corrisponde formalmente il Perceiver con weight sharing?",
    a: "Un <strong>RNN</strong>: <em>stato ricorrente</em> = latenti L^(t), <em>input</em> (costante nel tempo) = byte array X, <em>funzione di transizione</em> = blocco shared (CA + LT). Differenza chiave: a ogni passo i latenti vedono TUTTO l'input simultaneamente." },
  { id: 64, cat: "ws",
    q: "Effetto del weight sharing su parametri e accuracy (ImageNet, Tab. 7).",
    a: "<strong>Senza</strong>: ~326M params, 72.9% (overfitting). <strong>Con</strong>: ~45M params, <strong>78.0%</strong>. ⇒ ~7× meno parametri E +5.1% accuracy. Agisce da regolarizzatore potente." },

  // --- OUTPUT ---
  { id: 70, cat: "output",
    q: "Come si arriva dalla forma latente alla classe predetta?",
    a: "<strong>(1)</strong> Global average pooling: <code>h = (1/N) Σ L^(T)_i ∈ ℝ^D</code>. <strong>(2)</strong> Classificatore lineare: <code>z = h·W_c + b_c ∈ ℝ^1000</code>. <strong>(3)</strong> Softmax → probabilità, <code>ŷ = argmax p_i</code>." },
  { id: 71, cat: "output",
    q: "Forma di W_c e b_c nel classificatore (ImageNet).",
    a: "<code>W_c ∈ ℝ^(1024×1000)</code>, <code>b_c ∈ ℝ^1000</code>." },
  { id: 72, cat: "output",
    q: "Il Perceiver usa un token [CLS] come BERT/GPT?",
    a: "<strong>NO</strong>. Il pooling medio è la soluzione più diretta e <em>non introduce nuovi parametri</em>." },
  { id: 73, cat: "output",
    q: "Il pooling è fatto prima o dopo la proiezione lineare?",
    a: "<strong>PRIMA</strong> (fix del paper, App. F). Riduce il costo della proiezione (si applica a un solo vettore invece che a N) e stabilizza il training." },

  // --- TRAINING ---
  { id: 80, cat: "training",
    q: "Quale ottimizzatore usa il paper per ImageNet?",
    a: "<strong>LAMB</strong> (You et al. 2020). Il paper riporta che il Perceiver è più facile da ottimizzare con LAMB che con Adam." },
  { id: 81, cat: "training",
    q: "Quante epoche e quale schedule del learning rate?",
    a: "<strong>120 epoche</strong>; LR iniziale <code>4×10⁻³</code> con <em>step decay</em> (÷10 alle epoche 84/102/114). Niente cosine, niente warmup." },
  { id: 82, cat: "training",
    q: "Perché niente dropout nel Perceiver?",
    a: "Il paper lo ha provato → <strong>peggioramento</strong> (App. C). Il modello ha già forti pressioni regolarizzanti: bottleneck N≪M, weight sharing, weight decay, RandAugment." },
  { id: 83, cat: "training",
    q: "Quanti parametri totali ha il Perceiver (ImageNet)?",
    a: "<strong>~45M</strong>, paragonabile a una ResNet usata su ImageNet." },

  // --- RISULTATI ---
  { id: 90, cat: "risultati",
    q: "Top-1 accuracy del Perceiver su ImageNet (pixel grezzi).",

// ============================================================
//   STATO & PERSISTENZA
// ============================================================
const STORAGE_KEY = "perceiver_quiz_state_v1";
function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
  catch (e) { return {}; }
}
function saveState(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
  catch (e) {}
}
function defaultCardState() {
  return { ef: 2.5, reps: 0, interval: 0, nextReview: 0, seen: 0, correct: 0 };
}

// ============================================================
//   SM-2 SEMPLIFICATO
// ============================================================
function gradeCard(s, grade) {
  const now = Date.now();
  s.seen = (s.seen || 0) + 1;
  if (grade < 3) {
    s.reps = 0; s.interval = 0;
    s.nextReview = now + 60 * 1000; // 1 minuto
  } else {
    s.correct = (s.correct || 0) + 1;
    s.reps++;
    if (s.reps === 1) s.interval = 1;
    else if (s.reps === 2) s.interval = 3;
    else s.interval = Math.round(s.interval * s.ef);
    const delta = 0.1 - (5 - grade) * (0.08 + (5 - grade) * 0.02);
    s.ef = Math.max(1.3, s.ef + delta);
    s.nextReview = now + s.interval * 24 * 3600 * 1000;
  }
  return s;
}

// ============================================================
//   QUEUE
// ============================================================
let state = loadState();
let currentMode = "srs";
let activeCategory = null;
let currentCardId = null;
let queue = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildQueue() {
  const now = Date.now();
  const pool = CARDS.filter(c => !activeCategory || c.cat === activeCategory);
  if (currentMode === "srs") {
    const due = pool.filter(c => {
      const s = state[c.id];
      return s && s.nextReview && s.nextReview <= now;
    });
    const fresh = pool.filter(c => !state[c.id] || !state[c.id].nextReview);
    queue = [...shuffle(due), ...shuffle(fresh)];
  } else {
    queue = shuffle(pool);
  }
}
function nextCard() {
  if (queue.length === 0) buildQueue();
  const card = queue.shift();
  currentCardId = card ? card.id : null;
  renderCard();
}

// ============================================================
//   RENDER
// ============================================================
function renderStats() {
  const now = Date.now();
  let seen = 0, mastered = 0, due = 0, totalCorrect = 0, totalSeen = 0;
  CARDS.forEach(c => {
    const s = state[c.id];
    if (s && s.seen) {
      seen++;
      totalSeen += s.seen;
      totalCorrect += s.correct || 0;
      if (s.reps >= 3) mastered++;
      if (s.nextReview && s.nextReview <= now) due++;
    }
  });
  const accuracy = totalSeen > 0 ? Math.round(100 * totalCorrect / totalSeen) : 0;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><strong>${seen}/${CARDS.length}</strong><span>Viste</span></div>
    <div class="stat"><strong>${mastered}</strong><span>Padroneggiate</span></div>
    <div class="stat"><strong>${due}</strong><span>Da ripassare</span></div>
    <div class="stat"><strong>${accuracy}%</strong><span>Accuratezza</span></div>
  `;
}

function renderFilters() {
  const counts = {};
  CARDS.forEach(c => { counts[c.cat] = (counts[c.cat] || 0) + 1; });
  const all = `<div class="chip ${!activeCategory ? "active" : ""}" data-cat="">Tutte <span class="chip-count">${CARDS.length}</span></div>`;
  const chips = Object.keys(CATEGORIES).map(k => {
    const n = counts[k] || 0;
    if (!n) return "";
    const cls = activeCategory === k ? "active" : "";
    return `<div class="chip ${cls}" data-cat="${k}">${CATEGORIES[k]} <span class="chip-count">${n}</span></div>`;
  }).join("");
  document.getElementById("filters").innerHTML = all + chips;
  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      activeCategory = chip.dataset.cat || null;
      buildQueue();
      renderFilters();
      nextCard();
    });
  });
}

function renderCard() {
  const card = CARDS.find(c => c.id === currentCardId);
  const el = document.getElementById("card");
  if (!card) {
    el.innerHTML = `
      <div class="empty">
        <h2>🎉 Tutto ripassato!</h2>
        <p>Per ora non hai card da rivedere in questa categoria.<br>
        Torna fra un po' o passa alla modalità random.</p>
        <button class="btn-primary" id="goRandom">Modalità random</button>
      </div>`;
    document.getElementById("goRandom")?.addEventListener("click", () => {
      document.querySelector('[data-mode="all"]').click();
    });
    return;
  }
  const s = state[card.id] || defaultCardState();
  const progress = s.seen ? `Vista ${s.seen}× · Streak ${s.reps}` : "Nuova";
  el.innerHTML = `
    <div class="card-header">
      <div class="card-category">${CATEGORIES[card.cat]}</div>
      <div class="card-progress">${progress}</div>
    </div>
    <div class="question">${card.q}</div>
    <button class="btn-primary" id="reveal">Mostra risposta</button>
    <div class="answer hidden" id="answer">${card.a}</div>
    <div class="grading hidden" id="grading">
      <button class="btn-grade btn-grade-bad" data-grade="0">Non sapevo <kbd>1</kbd></button>
      <button class="btn-grade btn-grade-mid" data-grade="3">Faticato <kbd>2</kbd></button>
      <button class="btn-grade btn-grade-good" data-grade="5">Sapevo <kbd>3</kbd></button>
    </div>
  `;
  document.getElementById("reveal").addEventListener("click", revealAnswer);
  document.querySelectorAll("[data-grade]").forEach(b => {
    b.addEventListener("click", () => gradeAndNext(parseInt(b.dataset.grade)));
  });
}

function revealAnswer() {
  document.getElementById("answer")?.classList.remove("hidden");
  document.getElementById("grading")?.classList.remove("hidden");
  document.getElementById("reveal")?.classList.add("hidden");
}

function gradeAndNext(grade) {
  const s = state[currentCardId] || defaultCardState();
  state[currentCardId] = gradeCard(s, grade);
  saveState(state);
  // Re-queue failed card per same-session re-test
  if (grade < 3) {
    const card = CARDS.find(c => c.id === currentCardId);
    if (card) {
      const at = Math.min(2, queue.length);
      queue.splice(at, 0, card);
    }
  }
  renderStats();
  nextCard();
}

// ============================================================
//   KEYBOARD
// ============================================================
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  const answerVisible = !document.getElementById("answer")?.classList.contains("hidden");
  if (e.code === "Space") {
    e.preventDefault();
    if (!answerVisible) revealAnswer();
  } else if (answerVisible) {
    if (e.key === "1") gradeAndNext(0);
    else if (e.key === "2") gradeAndNext(3);
    else if (e.key === "3") gradeAndNext(5);
  }
});

// ============================================================
//   MODE TOGGLE & RESET
// ============================================================
document.querySelectorAll(".mode").forEach(m => {
  m.addEventListener("click", () => {
    document.querySelectorAll(".mode").forEach(x => x.classList.remove("active"));
    m.classList.add("active");
    currentMode = m.dataset.mode;
    buildQueue();
    nextCard();
  });
});

document.getElementById("reset").addEventListener("click", () => {
  if (confirm("Resetta TUTTO il progresso? L'azione non è reversibile.")) {
    state = {};
    saveState(state);
    renderStats();
    buildQueue();
    nextCard();
  }
});

// ============================================================
//   INIT
// ============================================================
renderStats();
renderFilters();
buildQueue();
nextCard();
</script>
